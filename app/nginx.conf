server {
    listen 80;
    server_name localhost;

    location /seervi-app {
        alias /usr/share/nginx/html/seervi-app;
        index index.html index.htm;
        try_files $uri $uri/ /seervi-app/index.html;
        
        include /etc/nginx/mime.types;
    }

    # Redirect root to /seervi-app/
    location = / {
        return 301 /seervi-app/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
